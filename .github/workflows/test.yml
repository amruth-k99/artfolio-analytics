name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx alembic pytest-asyncio
        
    - name: Run Pytest
      env:
        DEBUG: "True"
        SECRET_KEY: "test_secret_key"
        DATABASE_URL: "sqlite:///src/db/test.db"
        DEPLOYMENT_EMAIL: "test@domain.com"
      run: |
        # Create a local .env required by pydantic BaseSettings 
        echo "DATABASE_URL=sqlite:///src/db/test.db" > .env
        echo "SECRET_KEY=test_secret_key" >> .env
        echo "DEPLOYMENT_EMAIL=test@domain.com" >> .env
        
        PYTHONPATH=. pytest
